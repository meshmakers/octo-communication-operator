parameters:
  - name: Repository
    type: string
  - name: Dockerfile
    type: string
  - name: IsRelease
    type: boolean
  - name: Architecture
    type: string
    default: amd64
    
steps:
- task: Docker@2
  displayName: Build ${{ parameters.Repository }}
  inputs:
    command: build
    repository: ${{ parameters.Repository }}
    dockerfile: ${{ parameters.Dockerfile }}
    buildContext: $(System.DefaultWorkingDirectory)
    tags: |
      ${{ parameters.Architecture }}-$(Build.BuildNumber)

- task: Docker@2
  condition: ${{ eq(parameters.IsRelease, true) }}
  displayName: Push to public ${{ parameters.Repository }}
  inputs:
    command: push
    containerRegistry: $(DockerRegistryPublicConnection)
    repository: ${{ parameters.Repository }}
    tags: |
      ${{ parameters.Architecture }}-$(Build.BuildNumber)
      
- task: Docker@2
  displayName: Tag docker image for for private ${{ parameters.Repository }}
  inputs:
    command: tag
    arguments: ${{ parameters.Repository }}:${{ parameters.Architecture }}-$(Build.BuildNumber) $(DockerRegistryPrivateUri)/${{ parameters.Repository }}:${{ parameters.Architecture }}-$(Build.BuildNumber)      
      
- task: Docker@2
  displayName: Push to private ${{ parameters.Repository }}
  inputs:
    command: push
    containerRegistry: $(DockerRegistryPrivateConnection)
    repository: ${{ parameters.Repository }}
    tags: |
      ${{ parameters.Architecture }}-$(Build.BuildNumber)
