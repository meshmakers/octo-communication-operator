parameters:
  - name: ContainerRegistry
    type: string
  - name: Repository
    type: string
  - name: Dockerfile
    type: string
  - name: IsRelease
    type: boolean
  - name: Architecture
    type: string
    default: amd64

steps:
  - task: Docker@2
    displayName: Build ${{ parameters.Repository }}:${{ parameters.Architecture }}-$(Build.BuildNumber)
    inputs:
      command: build
      containerRegistry: ${{ parameters.ContainerRegistry }}
      repository: ${{ parameters.Repository }}
      dockerfile: ${{ parameters.Dockerfile }}
      buildContext: $(System.DefaultWorkingDirectory)
      tags: |
        ${{ parameters.Architecture }}-$(Build.BuildNumber)

  - task: Docker@2
    condition: ${{ eq(parameters.IsRelease, true) }}
    displayName: Push ${{ parameters.Repository }}:${{ parameters.Architecture }}-$(Build.BuildNumber)
    inputs:
      command: push
      containerRegistry: ${{ parameters.ContainerRegistry }}
      repository: ${{ parameters.Repository }}
      tags: |
        ${{ parameters.Architecture }}-$(Build.BuildNumber)
