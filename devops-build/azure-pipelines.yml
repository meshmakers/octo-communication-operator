name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - main
  tags:
    exclude:
      - '*'

variables:
  - group: GitSSHGroup
  - group: ApiKeys
  - group: OctoDefault
  - name: solutionFile
    value: 'Octo.CommunicationController.sln'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}

stages:
 - stage: Build
   jobs:
     - job: local_build
       displayName: "Build nuget and execute tests"
       pool:
         name: Gerald-Local-Linux
       steps:
         - template: update-build-number.yml
         - checkout: self
           clean: true
           submodules: true
         - template: set-version.yml
         - template: download-ca.yml           
         - task: PowerShell@2
           displayName: "Enable multiarch support"
           inputs:
             targetType: 'inline'
             script: |
              docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
         - task: DotNetCoreCLI@2
           displayName: 'Test'
           inputs:
             command: 'test'
             projects: |
               '**/*Tests.csproj'
               !'**/*SystemTests.csproj'
             testRunTitle: 'CI'
         - template: build-and-push-docker-image.yml
           parameters:
             Repository: meshmakers/octo-communication-operator
             Dockerfile: src/CommunicationOperator/DockerfileArm64v8
             IsRelease: ${{ variables.isRelease }}
             Architecture: 'arm64v8'
         - template: build-and-push-docker-image.yml
           parameters:
             Repository: meshmakers/octo-communication-operator
             Dockerfile: src/CommunicationOperator/Dockerfile
             IsRelease: ${{ variables.isRelease }}
             Architecture: 'amd64'
         - task: PowerShell@2
           displayName: 'Create versioninfo file'
           inputs:
             targetType: 'inline'
             script: |
               New-Item $(build.artifactstagingdirectory)/versioninfo.txt
               Set-Content $(build.artifactstagingdirectory)/versioninfo.txt $(Build.BuildNumber)
         - task: PublishBuildArtifacts@1
           displayName: 'Publish Artifact: local'
           inputs:
             ArtifactName: local
     

